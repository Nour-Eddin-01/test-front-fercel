
services:
  postgres:
    image: postgres:15-alpine
    container_name: tradehub-db
    command: [
      "postgres",
      "-c", "log_min_messages=warning", 
      "-c", "log_checkpoints=off"
    ]
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - tradehub-db:/var/lib/postgresql/data
    logging:
      driver: "gelf"
      options:
        gelf-address: "udp://127.0.0.1:12201"
        tag: "database-status"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tradehub-network

  redis:
    image: redis:7-alpine
    container_name: tradehub-redis
    ports:
      - "6379:6379"
    logging:
      driver: "gelf"
      options:
        gelf-address: "udp://127.0.0.1:12201"
        tag: "redis-status"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tradehub-network

  nginx:
    build: 
      context: ./infrastructure/nginx
      dockerfile: Dockerfile
    container_name: tradehub-nginx
    environment:
      - KIBANA_USER=${KIBANA_USER}
      - KIBANA_PASSWORD=${KIBANA_PASSWORD}
    ports:
      - "80:80" 
      - "443:443" 
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: "gelf"
      options:
        gelf-address: "udp://127.0.0.1:12201"
        tag: "nginx-proxy"
    depends_on:
      - backend
      - frontend
    networks:
      - tradehub-network
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: tradehub-backend
    env_file: .env
    ports:
      - "3000:3000"
      - "5555:5555"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app   
      - /app/node_modules
    logging:
      driver: "gelf"
      options:
        gelf-address: "udp://127.0.0.1:12201"
        tag: "backend-status"
    networks:
      - tradehub-network
    command: npm run start:dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tradehub-frontend
    env_file: .env
    ports:
      - "3001:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - tradehub-network
    command: npm run dev -- --host

  
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
    container_name: tradehub-elastic
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=90%
      - cluster.routing.allocation.disk.watermark.high=95%
      - cluster.routing.allocation.disk.watermark.flood_stage=98%
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1g -Xmx1g  
    volumes:
      - ./infrastructure/elk/elasticsearch/data:/usr/share/elasticsearch/data
    networks:
      - tradehub-network

  elk-setup:
    image: alpine:latest
    container_name: tradehub-elk-setup
    volumes:
      - ./infrastructure/elk/setup/setup_ilm.sh:/setup_ilm.sh:ro
      - ./infrastructure/elk/setup/dashboard.ndjson:/dashboard.ndjson:ro
    entrypoint: ["/bin/sh", "-c"]
    command: 
      - |
        apk add --no-cache curl
        sh /setup_ilm.sh
    networks:
      - tradehub-network
    depends_on:
      - elasticsearch


  logstash:
    image: docker.elastic.co/logstash/logstash:7.17.10
    container_name: tradehub-logstash
    volumes:
      - ./infrastructure/elk/logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    ports:
      - "5044:5044"
      - "12201:12201/udp"
    depends_on:
      - elasticsearch
    networks:
      - tradehub-network

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.10
    container_name: tradehub-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_BASEPATH="/kibana"        
      - SERVER_REWRITEBASEPATH="true"   
    depends_on:
      - elasticsearch
    networks:
      - tradehub-network



  prometheus:
    image: prom/prometheus:latest
    container_name: tradehub-prometheus
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - tradehub-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: tradehub-node-exporter
    ports:
      - "9100:9100"
    networks:
      - tradehub-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: tradehub-cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    networks:
      - tradehub-network


  grafana:
    image: grafana/grafana-oss:latest
    container_name: tradehub-grafana
    ports:
      - "3002:3000" 
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning/datasources/:/etc/grafana/provisioning/datasources/
      - ./infrastructure/monitoring/grafana/provisioning/dashboards/:/etc/grafana/provisioning/dashboards/
      - ./infrastructure/monitoring/grafana/dashboards/:/var/lib/grafana/dashboards/
      
      - ./infrastructure/monitoring/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting

    environment:
      - GF_SECURITY_ADMIN_USER=${GF_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_PASSWORD}
      - DISCORD_URL=${DISCORD_WEBHOOK_URL}
    env_file:
      - .env
    networks:
      - tradehub-network

volumes:
  tradehub-db:

networks:

  tradehub-network:
    driver: bridge