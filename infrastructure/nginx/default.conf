log_format json_traffic escape=json
  '{'
    '"time": "$time_iso8601", '
    '"remote_addr": "$remote_addr", '
    '"request": "$request", '
    '"status": $status, '
    '"request_time": $request_time, '
    '"service": "nginx-traffic"'
  '}';

server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/ssl/tradehub.crt;
    ssl_certificate_key /etc/nginx/ssl/tradehub.key;

    proxy_buffers 32 32k;
    proxy_buffer_size 64k;
    proxy_busy_buffers_size 128k;
    
    proxy_max_temp_file_size 0;
    client_body_buffer_size 1m;

    access_log /var/log/nginx/access.log json_traffic;

    location /kibana/ {
        auth_basic           "Admin Area - Identification Required";
        auth_basic_user_file /etc/nginx/conf.d/.htpasswd;
        proxy_pass           http://tradehub-kibana:5601; 
        
        client_max_body_size 50M;

        proxy_set_header     Host $host;
        proxy_set_header     X-Real-IP $remote_addr;
        proxy_set_header     X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header     X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /api/ {
        proxy_pass http://tradehub-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://tradehub-frontend:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}